<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Francisco Micael — Software Engineer and Founder</title>
  <desc id="desc">Ivory serif lettering and a luminous black hole on a near-black background. Black Hole Company, Brazil.</desc>
  <!-- Artwork reused from black-hole-project/public/black-hole.webp. -->
  <defs>
    <linearGradient id="veil">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.48" stop-color="#050505" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="460" fill="#050505"/>
  <image x="475" y="-12" width="760" height="507" xlink:href="data:image/webp;base64,"/>
  <rect x="475" width="725" height="460" fill="url(#veil)"/>
  <g fill="#d0a83f" font-family="Consolas, 'Liberation Mono', monospace" font-size="21" letter-spacing="3">
